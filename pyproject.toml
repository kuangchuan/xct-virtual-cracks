[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xct-virtual-cracks"
version = "0.1.0"
description = "Image-informed native-pixel virtual crack generation and XCT segmentation research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.2",
  "scikit-image==0.25.2",
  "tifffile==2025.2.18",
  "pandas==2.3.3",
  "torch==2.5.1",
  "monai==1.5.2",
  "olefile==0.47",
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xct_cracks = ["source_provenance.json"]
